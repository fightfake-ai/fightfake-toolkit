[workspace]
members = ["fightfake-core", "fightfake-cli", "fightfake-wasm"]
resolver = "2"

# Eva's video crate depends on patched versions of these arkworks crates.
# The same patches must be declared at the workspace level so Cargo resolves
# them identically here and inside the video Git dependency.
[patch.crates-io]
ark-groth16  = { git = "https://github.com/winderica/groth16", branch = "experimental" }
ark-relations = { git = "https://github.com/winderica/snark",  branch = "experimental" }
ark-r1cs-std  = { git = "https://github.com/winderica/r1cs-std", branch = "experimental" }

[profile.release]
opt-level   = 3
lto         = "thin"
incremental = true
panic       = "abort"

[profile.test]
opt-level = 3
