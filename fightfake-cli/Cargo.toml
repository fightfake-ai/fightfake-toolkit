[package]
name    = "fightfake-cli"
version = "0.1.0"
edition = "2021"
description = "Full-workflow CLI: decode → edit → prove → verify → C2PA"

[[bin]]
name = "fightfake"
path = "src/main.rs"

[features]
default = []
# Enable the real Nova IVC + Groth16 prover (heavy; requires Eva's video crate).
# Without this flag, `prove-edit` runs in Level-0 mode: edits and hashes the
# video but emits a placeholder proof.  Use `--features eva-backend` to build
# the cryptographic prover.
eva-backend = [
    "dep:video",
    "dep:ndarray",
    "dep:ark-bn254",
    "dep:ark-grumpkin",
    "dep:ark-ec",
    "dep:ark-ff",
    "dep:ark-std",
    "dep:ark-groth16",
    "dep:ark-snark",
    "dep:ark-serialize",
    "dep:ark-crypto-primitives",
    "dep:folding-schemes",
    "dep:rand",
    "dep:rayon",
]

[dependencies]
fightfake-core = { path = "../fightfake-core" }

anyhow     = "1"
c2pa       = { version = "0.53", features = ["file_io"] }
clap       = { version = "4", features = ["derive"] }
hex        = "0.4"
mime_guess = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"

# Eva backend — optional, gated on `eva-backend` feature.
# Pinned to a specific commit for reproducibility.
video = { git = "https://github.com/fightfake-ai/eva", package = "video",
          rev = "2fb3eabd3d8e5493457a3f5ddea3259968c99d01", optional = true }

# Arkworks deps used directly in the prover (same versions as Eva's video crate).
# Only compiled when `eva-backend` is enabled.
ark-bn254                = { version = "^0.5.0", features = ["r1cs"], optional = true }
ark-grumpkin             = { version = "^0.5.0", features = ["r1cs"], optional = true }
ark-ec                   = { version = "^0.5.0", optional = true }
ark-ff                   = { version = "^0.5.0", features = ["asm"], optional = true }
ark-std                  = { version = "^0.5.0", optional = true }
ark-groth16              = { version = "^0.5.0", optional = true }
ark-snark                = { version = "^0.5.0", optional = true }
ark-serialize            = { version = "^0.5.0", optional = true }
ark-crypto-primitives    = { version = "^0.5.0", default-features = false,
                             features = ["r1cs","sponge","crh"], optional = true }
folding-schemes          = { git = "https://github.com/fightfake-ai/eva",
                             package = "folding-schemes",
                             rev = "2fb3eabd3d8e5493457a3f5ddea3259968c99d01",
                             default-features = false,
                             features = ["cpu", "parallel"],
                             optional = true }
rand     = { version = "0.8", optional = true }
rayon    = { version = "1.7", optional = true }
ndarray  = { version = "0.15", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Used for ffmpeg subprocess calls (native only)
which = "6"
# Used for `make-test-cert` command
rcgen = "0.12"
