[package]
name    = "fightfake-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser-side WASM verifier for fightfake-toolkit proofs"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fightfake-core = { path = "../fightfake-core" }

wasm-bindgen      = "0.2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
serde-wasm-bindgen = "0.6"
anyhow            = "1"
hex               = "0.4"
sha2              = "0.10"

[dev-dependencies]
wasm-bindgen-test = "0.3"
