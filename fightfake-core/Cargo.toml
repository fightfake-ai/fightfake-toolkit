[package]
name    = "fightfake-core"
version = "0.1.0"
edition = "2021"
description = "Shared types, assertion schemas and verifier logic for fightfake-toolkit"

[features]
default = ["native-verify"]
# C2PA signature/hard-binding checks and JSON-schema validation (`verify`,
# `schema_utils` modules). `c2pa` (and, transitively, `ring`/`reqwest`) does
# not target `wasm32-unknown-unknown` cleanly, and `jsonschema` pulls in
# `reqwest::blocking`/`url::to_file_path`, neither available on wasm32 —
# so this is on by default (every native consumer, i.e. fightfake-cli,
# wants it) but fightfake-wasm builds with `default-features = false` and
# does without it (it never calls into either module — see that crate's
# lib.rs, it only reads `org.zkedit.*` assertions directly as JSON).
native-verify = ["dep:c2pa", "dep:jsonschema"]
# Real Groth16/Nova-decider proof verification (`proof_bundle` module) — see
# that module's doc comment for why it reimplements a slice of Eva's decider
# math instead of depending on `folding-schemes`/`video` directly (those
# require native threads and cannot target `wasm32-unknown-unknown`, which
# this feature is specifically meant to support). Kept optional so builds
# that don't need it (e.g. a browser extension not yet ready to pay for the
# arkworks stack) don't have to.
crypto-verify = [
    "dep:ark-bn254",
    "dep:ark-grumpkin",
    "dep:ark-ec",
    "dep:ark-ff",
    "dep:ark-serialize",
    "dep:ark-groth16",
    "dep:ark-snark",
]

[dependencies]
anyhow     = "1"
hex        = "0.4"
mime_guess = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"

# `native-verify` — native-only (see feature doc comment above).
c2pa       = { version = "0.53", features = ["file_io"], optional = true }
jsonschema = { version = "0.18", optional = true }

# Arkworks deps for `crypto-verify` — versions/patches mirror fightfake-cli's
# `eva-backend` feature so both resolve to the same crate graph.
ark-bn254     = { version = "^0.5.0", optional = true }
ark-grumpkin  = { version = "^0.5.0", optional = true }
ark-ec        = { version = "^0.5.0", optional = true }
ark-ff        = { version = "^0.5.0", optional = true }
ark-serialize = { version = "^0.5.0", optional = true }
ark-groth16   = { version = "^0.5.0", optional = true }
ark-snark     = { version = "^0.5.0", optional = true }

[dev-dependencies]
rand = "0.8"
