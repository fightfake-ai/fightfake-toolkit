[package]
name    = "fightfake-core"
version = "0.1.0"
edition = "2021"
description = "Shared types, assertion schemas and verifier logic for fightfake-toolkit"

[dependencies]
anyhow     = "1"
c2pa       = { version = "0.53", features = ["file_io"] }
hex        = "0.4"
jsonschema = "0.18"
mime_guess = "2"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
sha2       = "0.10"
